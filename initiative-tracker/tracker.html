<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Initiative Tracker</title>
        <link rel="stylesheet" href="/initiative-tracker/css/style.css" />
    </head>
    <body>
        <!-- 
        Convert images to base64 here:
        https://www.base64-image.de/
        -->
        <div id="setup">
            <table id="setupTable">
                <tr>
                    <th>Initiative</th>
                    <th>Name</th>
                    <th>Current HP</th>
                    <th>HP max</th>
                    <th>AC</th>
                    <th>statblock image link</th>
                    <th>player?</th>
                </tr>
            </table>

            <button type="button" onclick="addRow()">Add Row</button>
            <button type="button" onclick="finishSetup(false)">Finish Setup</button>
            <button type="button" onclick="setupFromLocalStorage()">Set up from localStorage</button>
        </div>
        <div id="using"></div>
        <div id="clearStorage">
            <button type="button" onclick="downloadJSON()">Download State</button>
            <button type="button" onclick="uploadJSON()">Upload State</button>
        </div>
        <script src="/initiative-tracker/js/script.js"></script>
    </body>
</html>
