<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>GM map creator</title>
        <link rel="stylesheet" href="./css/style.css" />
        <script src="./js/hash_coder.js"></script>
        <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
        <script src="./js/main.js" type="module" defer></script>
    </head>
    <body>
        <div id="auth">
            <div>
                <input type="text" name="authInput" id="authInput" />
                <button type="button" id="authButton">Submit Password</button>
            </div>
        </div>
        <main>
            <div id="text-info">
                <h1>GM Map Creator</h1>
                <span>
                    Battle Name:
                    <input type="text" name="" id="battleName" />
                </span>
                <br /><br />
                <span>
                    GM Code:
                    <input type="text" name="" id="GMCode" />
                </span>
                <br /><br />
                <div id="tokenEditor">
                    <button type="button">Add Token</button>
                </div>
                <br />
                <button type="button" id="upload">Upload to the Database</button>
            </div>
            <!-- Map editor -->
            <div id="map-main">
                <span id="dimensions">Horizontal: 1, Vertical: 1</span>
                <span>Swatches:</span>
                <div id="colors">
                    <div id="add-swatch"><span>+</span></div>
                </div>
                <div id="map-editor">
                    <div>
                        <button id="+1">+</button>
                        <button id="-1">-</button>
                    </div>
                    <div>
                        <div>
                            <button id="+2">+</button>
                            <button id="-2">-</button>
                        </div>
                        <table>
                            <tbody>
                                <tr>
                                    <td></td>
                                </tr>
                            </tbody>
                        </table>
                        <div>
                            <button id="+4">+</button>
                            <button id="-4">-</button>
                        </div>
                    </div>
                    <div>
                        <button id="+3">+</button>
                        <button id="-3">-</button>
                    </div>
                </div>
            </div>
        </main>
    </body>
</html>
